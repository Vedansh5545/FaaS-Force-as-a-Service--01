face_recognition:
  enabled: true
  logging_enabled: true
  cascade_path: models/facial_recognition/haarcascade_frontalface_default.xml
  encodings_path: models/facial_recognition/encodings.pickle
  tolerance: 0.5
  scale_factor: 1.3
  min_neighbors: 6
  min_size: [40, 40]

yolo_vision:
  enabled: true
  logging_enabled: true
  model_path: yolov8s.pt
  min_conf: 0.5

ocr:
  enabled: true
  logging_enabled: true
  threads: 4
  mode: ocr
  output_format: text
